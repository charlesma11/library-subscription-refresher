<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>NYT Library Refresher — Options</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; max-width: 480px; padding: 24px; color: #222; }
    h1 { font-size: 18px; }
    label { display: block; margin-top: 12px; font-weight: 600; font-size: 13px; }
    input { width: 100%; padding: 6px 8px; margin-top: 4px; font-family: ui-monospace, monospace; font-size: 13px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 8px 16px; font-size: 14px; cursor: pointer; }
    .status { margin-top: 12px; min-height: 1em; font-size: 13px; }
  </style>
</head>
<body>
  <h1>NYT Library Refresher</h1>
  <label>Worker URL
    <input id="workerUrl" type="url" placeholder="https://nyt-refresher.xxx.workers.dev">
  </label>
  <label>Shared secret
    <input id="token" type="password" placeholder="32-char hex token">
  </label>
  <button id="save">Save</button>
  <div id="status" class="status" role="status"></div>
  <script src="options.js"></script>
</body>
</html>
